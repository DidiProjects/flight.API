server {
    listen 80;
    listen [::]:80;
    server_name api.didilv93.com 192.168.122.1;

    access_log /var/log/nginx/api.didilv93.com.log api_json;
    error_log  /var/log/nginx/api.didilv93.com-error.log warn;

    location /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location /flight/ {
        set $api_name "flight-api";
        access_log /var/log/nginx/flight-api.log api_json;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'      'https://flight-monitoring.netlify.app' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers'     'Authorization, Content-Type' always;
            add_header 'Access-Control-Max-Age'           86400;
            return 204;
        }

        proxy_pass         http://127.0.0.1:13011;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        error_page 502 503 504 @flight_unavailable;
    }

    location @flight_unavailable {
        default_type application/json;
        add_header 'Access-Control-Allow-Origin'      'https://flight-monitoring.netlify.app' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        return 503 '{"statusCode":503,"error":"Service Unavailable","message":"Servidor temporariamente indisponível"}';
    }

    location / {
        set $api_name "trem-api";
        access_log /var/log/nginx/trem-api.log api_json;

        proxy_pass         http://127.0.0.1:13002;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
